name: office_tracker
description: "Office presence and attendance tracking - employee app."
publish_to: 'none'

version: 1.0.27+10

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Non-secret preferences only. The device token goes in secure storage.
  shared_preferences: ^2.2.3

  # The device token is a long-lived credential that authenticates this person
  # to the attendance system, so it must not sit in SharedPreferences, which is
  # plaintext on disk.
  flutter_secure_storage: ^9.2.2

  # Real device model, replacing the hardcoded 'CPH2119' that every install
  # used to report.
  device_info_plus: ^10.1.2

  # SSID and BSSID of the connected network. The BSSID is what lets the server
  # verify the phone is actually on an office access point rather than trusting
  # the request blindly.
  network_info_plus: ^5.0.3

  # Reading the SSID/BSSID requires location permission on Android 8.1+, and
  # background presence requires it on both platforms.
  permission_handler: ^11.3.1

  # Real background execution. A Timer.periodic in a StatefulWidget stops the
  # moment the app is backgrounded, which is why the old "pings every 15s in
  # background" claim was false.
  flutter_background_service: ^5.0.10

  # Android-only. The presence background service demotes itself outside
  # office hours and gets killed by the OS once it's not a foreground
  # service and the app isn't open -- RECEIVE_BOOT_COMPLETED only restarts
  # it after a device reboot, not every morning. This schedules a real
  # OS-level alarm (survives the Dart VM/app being fully killed) to restart
  # the service at 11:00 AM daily.
  android_alarm_manager_plus: ^4.0.6
  file_picker: ^8.1.7
  flutter_local_notifications: ^18.0.1
  # Break reminders are scheduled with the OS alarm system at a fixed instant
  # (zonedSchedule), so they fire with no network and survive the app closing.
  timezone: ^0.10.1
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.0
  open_file: ^3.5.10
  path_provider: ^2.1.5
  flutter_dotenv: ^6.0.1

  # Plus Jakarta Sans (UI) + JetBrains Mono (timers/durations). Fetched once
  # and cached on the device; falls back to the platform font while offline.
  google_fonts: ^6.2.1

  # Verifying the downloaded APK's SHA-256 against the release record before
  # handing it to the system installer -- the backend's download_url can
  # point anywhere (GitHub Release asset, Supabase storage, ...), so this is
  # the only thing standing between a compromised/MITM'd download and an
  # unverified package install.
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
