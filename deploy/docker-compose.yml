# Office Tracker on a single VPS (fwtracker.tech).
#
# Both services listen on 127.0.0.1 only; the host's existing nginx
# (CloudPanel) terminates HTTPS and proxies:
#   api.fwtracker.tech -> 127.0.0.1:4100 (backend)
#   fwtracker.tech     -> 127.0.0.1:3100 (dashboard, which proxies /api to the backend)
#
# backend.env holds the secrets (DATABASE_URL, ADMIN_API_KEY, ...). It is not
# in git; copy it next to this file on the server.
name: fwtracker

services:
  backend:
    build: ../backend
    image: fwtracker-backend:latest
    restart: unless-stopped
    env_file: ./backend.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      TZ: Asia/Karachi
      # A long-running host: the maintenance loop runs in-process (no cron
      # needed) and the dashboard's SSE stream is fine here.
      SSE_ENABLED: "1"
      # Requests arrive from host nginx through Docker's bridge; trust only
      # those private hops so X-Forwarded-For can't be spoofed by a client
      # (office location checks depend on the real source address).
      TRUST_PROXY: "loopback, uniquelocal"
      CORS_ORIGIN: https://fwtracker.tech
    ports:
      - "127.0.0.1:4100:5000"
    volumes:
      - backend-data:/app/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  dashboard:
    build:
      context: ../dashboard
      args:
        API_ORIGIN: http://backend:5000
    image: fwtracker-dashboard:latest
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "127.0.0.1:3100:3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  backend-data:
