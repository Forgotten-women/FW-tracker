[package]
name = "office-tracker-desktop"
version = "1.0.40"
description = "WorkSync Desktop Agent"
authors = ["WorkSync Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5.3", features = [] }

[dependencies]
tauri = { version = "1.5.4", features = ["api-all", "system-tray", "updater"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
chrono = "0.4"
dirs = "5.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
uuid = { version = "1.7", features = ["v4"] }
# Live screen view (live.rs, capture.rs): native capture + JPEG instead of a
# PowerShell process per session, and a Supabase Realtime WebSocket so a
# viewer request reaches the laptop instantly instead of on a 20s poll.
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
# 0.20 on purpose: it uses rustls 0.21 (ring) like reqwest 0.11 above. Newer
# releases default to aws-lc-rs, which needs CMake + NASM to build on Windows.
tokio-tungstenite = { version = "0.20", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_NetworkManagement_WiFi",
    "Win32_Security_Cryptography",
    "Win32_System_StationsAndDesktops"
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
