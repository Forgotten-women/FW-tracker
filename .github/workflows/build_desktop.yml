name: 🖥️ Build Desktop Installers (Windows + macOS)

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'desktop-v*'          # e.g. git tag desktop-v1.0.1 && git push --tags
  workflow_dispatch:           # Manual trigger from GitHub Actions tab
    inputs:
      release_tag:
        description: 'Release tag (e.g. desktop-v1.0.0)'
        required: false
        default: 'desktop-v1.0.0-manual'

permissions:
  contents: write              # Needed to create GitHub Releases

# ── Build matrix: one job per OS ─────────────────────────────────────────────
jobs:
  build-desktop:
    name: Build ${{ matrix.platform == 'windows-latest' && 'Windows .msi' || 'macOS .dmg' }}
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest    # → produces office-tracker-agent_1.0.0_x64_en-US.msi
          - macos-latest      # → produces office-tracker-agent_1.0.0_x64.dmg

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Install Node.js ───────────────────────────────────────────────────
      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # ── 3. Install Rust (stable) ─────────────────────────────────────────────
      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 🍎 Ensure macOS dual compilation targets (Intel x86_64 + Apple Silicon ARM64)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # ── 4. Cache Rust build artifacts ────────────────────────────────────────
      - name: 🗂️ Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # ── 5. macOS: install Xcode command-line tools (needed for code signing) ─
      - name: 🍎 Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          xcode-select --install 2>/dev/null || true
          brew install create-dmg 2>/dev/null || true

      # ── 6. Windows: install WebView2 (already present on Win11 runners) ──────
      #   WebView2 is bundled into the .msi installer by default in Tauri v1,
      #   so no extra step needed for typical Windows targets.

      # ── 7. Install Node dependencies ─────────────────────────────────────────
      - name: 📦 Install desktop npm packages
        run: npm ci
        working-directory: desktop

      # ── 8. Build Tauri installer ──────────────────────────────────────────────
      - name: 🔨 Build Tauri app (${{ matrix.platform }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing/notarization (optional – leave empty to skip).
          # For production, set these in GitHub → Settings → Secrets:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          #
          # Updater signing -- REQUIRED for auto-update. tauri.conf.json's
          # updater.pubkey is the public half of this same keypair (generated
          # via `npx @tauri-apps/cli signer generate`); without these two
          # secrets set in GitHub → Settings → Secrets and variables →
          # Actions, this build step produces installers but no signature,
          # and every running app's silent update check will simply find
          # nothing valid to install.
          #
          # Tauri v1's bundler (this project is on tauri 1.5.4, see
          # src-tauri/Cargo.toml) reads TAURI_PRIVATE_KEY / TAURI_KEY_PASSWORD
          # specifically -- TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) is the v2
          # convention and is silently ignored by v1, which is why an earlier
          # version of this workflow built unsigned installers despite the
          # secrets being set. The GitHub secret names themselves don't need
          # to change -- only which env var name they're exposed as here.
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: npx @tauri-apps/cli
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}
          includeDebug: false
          includeRelease: true
          includeUpdaterJson: true

      # ── 9. Determine artifact paths ───────────────────────────────────────────
      - name: 📍 Find built installer(s)
        id: artifacts
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            MSI=$(find desktop/src-tauri/target -name "*.msi" 2>/dev/null | head -1)
            NSIS=$(find desktop/src-tauri/target -name "*.exe" 2>/dev/null | head -1)
            echo "paths=$MSI $NSIS" >> $GITHUB_OUTPUT
            echo "Found Windows: $MSI | $NSIS"
          else
            DMG=$(find desktop/src-tauri/target -name "*.dmg" 2>/dev/null | head -1)
            APP=$(find desktop/src-tauri/target -name "*.app.tar.gz" 2>/dev/null | head -1)
            echo "paths=$DMG $APP" >> $GITHUB_OUTPUT
            echo "Found macOS: $DMG | $APP"
          fi

      # ── 10. Upload to GitHub Release ──────────────────────────────────────────
      - name: 🚀 Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: 🖥️ Office Tracker Desktop ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ## Office Tracker Desktop Agent

            ### 📥 Downloads
            | Platform | Installer | Notes |
            |----------|-----------|-------|
            | **Windows 10/11** | `.msi` file below | Double-click to install. No Node.js needed. |
            | **macOS (Universal)** | `.dmg` file below | Built for **Intel (x86_64)** + **Apple Silicon (M1/M2/M3/M4)**. |

            ### 🍎 macOS First-Time Launch (Intel & Apple Silicon)
            Because this application is distributed directly within your organization:
            1. Drag **Office Tracker.app** to your **/Applications** folder.
            2. If macOS reports *"developer cannot be verified"* or blocks opening on first run:
               - **Option A**: Right-click (or Control-click) `Office Tracker.app` in Applications and choose **Open**, then click **Open**.
               - **Option B**: Open Terminal and run:
                 ```bash
                 xattr -cr "/Applications/Office Tracker.app"
                 ```

            ### 🔐 First-time setup
            On first launch, the registration window opens automatically.
            Enter the 8-character pairing code provided by HR to link your workstation.

            ### ℹ️ What it does
            - Tracks your active work time and in-office presence
            - Syncs with the HR dashboard in real-time
            - Detects idle time automatically
            - Keystrokes are **never** recorded — privacy first

            ---
            *Built automatically by GitHub Actions from commit `${{ github.sha }}`*
          generate_release_notes: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            desktop/src-tauri/target/**/bundle/msi/*.msi
            desktop/src-tauri/target/**/bundle/msi/*.msi.zip
            desktop/src-tauri/target/**/bundle/msi/*.msi.zip.sig
            desktop/src-tauri/target/**/bundle/nsis/*.exe
            desktop/src-tauri/target/**/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/**/bundle/macos/*.app.tar.gz.sig
            desktop/src-tauri/target/**/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
