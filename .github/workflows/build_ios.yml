name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd forgottenwomen
          flutter pub get

      - name: Build iOS
        run: |
          cd forgottenwomen
          flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          cd forgottenwomen/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 OfficeTracker.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfficeTracker-iOS-IPA
          path: forgottenwomen/build/ios/iphoneos/OfficeTracker.ipa
          retention-days: 7