name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
      - name: Install dependencies
        run: |
          cd forgottenwomen
          flutter pub get
      - name: Build iOS IPA
        run: |
          cd forgottenwomen
          flutter build ios --release --no-codesign
