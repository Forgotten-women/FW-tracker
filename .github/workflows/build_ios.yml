name: Build iOS App

on:
  push:
    tags:
      - 'v*' # Triggers when pushing tags like v1.0.6, v1.0.7, etc.
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📝 Configure Environment (.env)
        run: |
          if [ -n "${{ secrets.BACKEND_URL }}" ]; then
            echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" > forgottenwomen/.env
          elif [ -f forgottenwomen/.env.example ]; then
            cp forgottenwomen/.env.example forgottenwomen/.env
          else
            echo "BACKEND_URL=https://backend-ten-lyart-57.vercel.app" > forgottenwomen/.env
          fi

      - name: Install dependencies
        run: |
          cd forgottenwomen
          flutter pub get

      - name: Build iOS
        run: |
          cd forgottenwomen
          flutter build ios --config-only --dart-define-from-file=.env || true
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build || flutter build ios --release --no-codesign --dart-define-from-file=.env || true
        continue-on-error: true

      - name: Package into IPA
        run: |
          cd forgottenwomen/build/ios/iphoneos
          if [ -d "Runner.app" ]; then
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r -9 OfficeTracker.ipa Payload
          else
            echo "Runner.app not found, skipping IPA packaging"
          fi
        continue-on-error: true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: OfficeTracker-iOS-IPA
          path: forgottenwomen/build/ios/iphoneos/OfficeTracker.ipa
          retention-days: 7